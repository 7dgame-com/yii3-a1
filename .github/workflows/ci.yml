name: CI

on:
  push:
    branches: ["*", "codex/identity-online-dev-20261012", "codex/identity-public-visibility-20261012"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Publish only a SHA-pinned y1 candidate; no mutable tags or deployment'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TENCENT_REGISTRY: hkccr.ccs.tencentyun.com
  TENCENT_IMAGE_NAME: gdgeek/yii3-a1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mrpp
          MYSQL_USER: mrpp
          MYSQL_PASSWORD: mrpp_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, pdo_sqlite, redis, zip
          coverage: none
          tools: composer:v2

      - name: Configure CA Certificates For Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates default-mysql-client
          sudo update-ca-certificates

          if [ -n "${{ secrets.CUSTOM_CA_CERT_B64 }}" ]; then
            echo "${{ secrets.CUSTOM_CA_CERT_B64 }}" | base64 -d | sudo tee /usr/local/share/ca-certificates/custom-ca.crt > /dev/null
            sudo update-ca-certificates
          fi

          composer config -g cafile /etc/ssl/certs/ca-certificates.crt
          composer config -g secure-http true

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare runtime
        run: |
          mkdir -p runtime
          echo "ci-jwt-secret-key-do-not-use-in-production" > runtime/jwt.key

      - name: Import test database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot mrpp < docker/init.sql

      - name: Run PHPUnit tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DB: mrpp
          MYSQL_USER: mrpp
          MYSQL_PASS: mrpp_secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          JWT_KEY: runtime/jwt.key
          YII_DEBUG: "true"
          YII_ENV: test
        run: composer test

      - name: Verify large snapshot private pagination on MySQL
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;dbname=mrpp
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
        run: php tests/manual/private_snapshot_large_payload_probe.php

  refresh_replay_test:
    name: Mandatory isolated refresh replay MySQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job gets its own runner and fresh services. It never reuses test/mrpp.
    services:
      codex-y1-refresh-mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: y1_refresh_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      codex-y1-refresh-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup PHP matching the runtime major
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_sqlite, redis, zip
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader
      - name: Bind dedicated fixture names only to this runner
        run: |
          set -euo pipefail
          for name in codex-y1-refresh-mysql codex-y1-refresh-redis; do
            if getent hosts "${name}" >/dev/null; then
              echo 'Fixture alias already exists; refusing to override it.' >&2
              exit 1
            fi
          done
          printf '%s\n' '127.0.0.1 codex-y1-refresh-mysql codex-y1-refresh-redis' | sudo tee -a /etc/hosts >/dev/null
          for name in codex-y1-refresh-mysql codex-y1-refresh-redis; do
            test "$(getent ahostsv4 "${name}" | awk '{print $1}' | sort -u)" = '127.0.0.1'
          done
      - name: Run every real refresh fixture without skips
        env:
          Y1_REFRESH_FIXTURE: "1"
          MYSQL_HOST: codex-y1-refresh-mysql
          MYSQL_DB: y1_refresh_test
          MYSQL_USER: root
          MYSQL_PASS: ""
          REDIS_HOST: codex-y1-refresh-redis
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          IDENTITY_DATA_SOURCE: legacy
          IDENTITY_INDEPENDENT_READY: "false"
          Y1_REFRESH_REPLAY_ENABLED: "false"
          Y1_REFRESH_REPLAY_KEY: ""
        run: php tests/manual/run_refresh_replay_ci.php

  candidate:
    name: Publish fixed development candidate
    runs-on: ubuntu-latest
    needs: [test, refresh_replay_test]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true) ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/codex/identity-online-dev-20261012' ||
        github.ref == 'refs/heads/codex/identity-public-visibility-20261012'
      ))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
      - name: Record fixed source revision
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          printf '%s\n' "${CANDIDATE_SHA}" > GIT_COMMIT
          TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S' > BUILD_TIME
      - name: Build and publish candidate only
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            YII_ENV=dev
            UNITY_DEV_LOGIN_FIXTURE_ENABLED=false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_IMAGE_NAME }}:candidate-${{ github.sha }}
      - name: Save candidate provenance
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
          CANDIDATE_RUN: ${{ github.run_id }}
          CANDIDATE_IMAGE: ${{ env.TENCENT_REGISTRY }}/${{ env.TENCENT_IMAGE_NAME }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - <<'PY'
          import json, os
          e = os.environ
          result = {"status": "published-candidate-not-live", "revision": e["CANDIDATE_SHA"],
                    "runId": e["CANDIDATE_RUN"], "platform": "linux/amd64",
                    "image": e["CANDIDATE_IMAGE"] + ":candidate-" + e["CANDIDATE_SHA"],
                    "digest": e["CANDIDATE_DIGEST"], "productionUntouched": True}
          with open("candidate-image.json", "w") as f:
              json.dump(result, f, indent=2)
              f.write("\n")
          PY
          printf 'y1 candidate: `%s@%s`\nNo mutable tags or deployment were performed.\n' "${CANDIDATE_IMAGE}" "${CANDIDATE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: yii3-a1-candidate-image-provenance-${{ github.sha }}
          path: candidate-image.json

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, refresh_replay_test]
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/publish' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USER }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Write Git Commit Hash
        run: echo "${{ github.sha }}" > GIT_COMMIT

      - name: Write Build Time
        run: TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S' > BUILD_TIME

      - name: Build and Push Docker Image
        run: |
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||' | sed 's|/|-|g')
          IMAGE="${TENCENT_REGISTRY}/${TENCENT_IMAGE_NAME}:${BRANCH_NAME}"

          IMAGE_YII_ENV=production
          UNITY_DEV_LOGIN_FIXTURE_ENABLED=false
          if [ "${BRANCH_NAME}" = "develop" ]; then
            IMAGE_YII_ENV=dev
            UNITY_DEV_LOGIN_FIXTURE_ENABLED=true
          fi

          docker build \
            --build-arg YII_ENV="${IMAGE_YII_ENV}" \
            --build-arg UNITY_DEV_LOGIN_FIXTURE_ENABLED="${UNITY_DEV_LOGIN_FIXTURE_ENABLED}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"

          if [ "${BRANCH_NAME}" = "publish" ]; then
            docker tag "${IMAGE}" "${TENCENT_REGISTRY}/${TENCENT_IMAGE_NAME}:latest"
            docker push "${TENCENT_REGISTRY}/${TENCENT_IMAGE_NAME}:latest"
          fi

  deploy:
    name: Deploy notification
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    steps:
      - name: Deploy Notification
        run: echo "publish branch deployed successfully"
